services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: protube
      POSTGRES_USER: protube
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U protube -d protube"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ENV_PROTUBE_STORE_DIR: /data/videos
      ENV_PROTUBE_DB_HOST: db
      ENV_PROTUBE_DB: protube
      ENV_PROTUBE_DB_USER: protube
      ENV_PROTUBE_DB_PWD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      ENV_PROTUBE_GOOGLE_CLIENT_ID: unused
      ENV_PROTUBE_GOOGLE_CLIENT_SECRET: unused
    volumes:
      - videos:/data/videos
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
  videos:
