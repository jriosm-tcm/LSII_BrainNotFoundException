services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: protube
      POSTGRES_USER: protube
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U protube -d protube"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ENV_PROTUBE_STORE_DIR: /data/videos
      ENV_PROTUBE_DB_HOST: db
      ENV_PROTUBE_DB: protube
      ENV_PROTUBE_DB_USER: protube
      ENV_PROTUBE_DB_PWD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      ENV_PROTUBE_GOOGLE_CLIENT_ID: unused
      ENV_PROTUBE_GOOGLE_CLIENT_SECRET: unused
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    volumes:
      - videos:/data/videos
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  videos:
