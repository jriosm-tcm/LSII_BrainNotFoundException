services:
  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${ENV_PROTUBE_DB_USER}
      POSTGRES_PASSWORD: ${ENV_PROTUBE_DB_PASS}
      POSTGRES_DB: ${ENV_PROTUBE_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: maven:3.9-amazoncorretto-21
    working_dir: /app/backend
    command: ["mvn", "-Pprod", "spring-boot:run", "-f", "pom.xml"]
    depends_on:
       db:
         condition: service_healthy
    environment:
      ENV_PROTUBE_STORE_DIR: /store
      ENV_PROTUBE_DB_HOST: db
      ENV_PROTUBE_DB: ${ENV_PROTUBE_DB}
      ENV_PROTUBE_DB_USER: ${ENV_PROTUBE_DB_USER}
      ENV_PROTUBE_DB_PASS: ${ENV_PROTUBE_DB_PASS}
      ENV_PROTUBE_GOOGLE_CLIENT_ID: ${ENV_PROTUBE_GOOGLE_CLIENT_ID:-}
      ENV_PROTUBE_GOOGLE_CLIENT_SECRET: ${ENV_PROTUBE_GOOGLE_CLIENT_SECRET:-}
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: .
        target: /app
      - backend_target:/app/backend/target
      - frontend_node_modules:/app/frontend/node_modules
      - maven_repo:/root/.m2
      - type: bind
        source: ${ENV_PROTUBE_STORE_DIR:-./store}
        target: /store
        read_only: true

volumes:
  postgres_data:
  backend_target:
  frontend_node_modules:
  maven_repo:
