# Isolated configuration: never import the developer's .env or use their database.
spring.application.name=protube-back-tests
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:init.sql
pro_tube.store.dir=${java.io.tmpdir}/
pro_tube.load_initial_data=false
